# yaml-language-server: $schema=../schema/beer.schema.json
#
# 啤酒品鉴数据。新增条目请参考 CONTRIBUTING.md。
# 字段说明：
#   id      唯一标识，小写英文 + 连字符
#   name    啤酒名称
#   brand   品牌 / 酒厂，可为空
#   style   风格 key，取值见 scripts/build.py 里的 STYLES
#   origin  产地，可为空
#   abv     酒精度（%），未知写 null
#   plato   原麦汁浓度（°P），未知写 null
#   price   单瓶价格档位 1=5元以下 2=5-10元 3=10-20元 4=20元以上，未知写 null
#   rating  主观评分 1-5
#   tags    风味关键词
#   notes   品鉴记录原文

